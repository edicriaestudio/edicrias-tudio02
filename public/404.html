<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Página Não Encontrada (404) | EdCria Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background-color: #080808;
        color: #f4f4f5;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: fixed;
        width: 460px;
        height: 460px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.14) 0%, rgba(8, 8, 8, 0) 70%);
        pointer-events: none;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .card {
        position: relative;
        z-index: 1;
        max-width: 560px;
        width: 100%;
        padding: 48px 36px;
        border-radius: 24px;
        border: 1px solid rgba(34, 211, 238, 0.25);
        background: rgba(10, 16, 24, 0.78);
        backdrop-filter: blur(20px);
        text-align: center;
        box-shadow: 0 0 60px rgba(6, 182, 212, 0.12);
      }
      .code {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #22d3ee;
        margin-bottom: 14px;
      }
      h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: clamp(1.75rem, 4vw, 2.35rem);
        font-weight: 800;
        line-height: 1.15;
        color: #ffffff;
        margin-bottom: 16px;
      }
      p {
        font-size: 1rem;
        line-height: 1.65;
        color: #a1a1aa;
        margin-bottom: 32px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 13px 24px;
        border-radius: 9999px;
        background: linear-gradient(135deg, #06b6d4, #2dd4bf);
        color: #041014;
        font-weight: 700;
        font-size: 0.9rem;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 24px rgba(6, 182, 212, 0.35);
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 13px 24px;
        border-radius: 9999px;
        border: 1px solid rgba(34, 211, 238, 0.35);
        background: rgba(6, 182, 212, 0.08);
        color: #cffafe;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .btn-secondary:hover {
        background: rgba(6, 182, 212, 0.16);
        border-color: rgba(34, 211, 238, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main class="card">
      <div class="code">Erro 404 • EdCria Studio</div>
      <h1>Página não encontrada</h1>
      <p>
        O endereço que você tentou acessar não existe ou foi movido.
        Retorne para a página inicial da EdCria Studio ou conheça nossas Landing Pages de Alta Conversão.
      </p>
      <nav class="actions" aria-label="Navegação de recuperação">
        <a class="btn-primary" href="https://edicria.com.br/">Ir para a Home</a>
        <a class="btn-secondary" href="https://edicria.com.br/landing-pages/">Ver Landing Pages</a>
      </nav>
    </main>
  </body>
</html>
